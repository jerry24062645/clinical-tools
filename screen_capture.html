<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Clinical Lab — Screen Capture</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7fa;color:#243746;margin:0;padding:28px}.card{max-width:900px;margin:auto;background:#fff;border:1px solid #d8dee6;border-radius:16px;padding:22px;box-shadow:0 8px 28px #0001}button{padding:11px 18px;border:0;border-radius:9px;background:#078f87;color:white;font-weight:700;cursor:pointer}.muted{color:#667085;font-size:14px}#msg{margin:12px 0}img{max-width:100%;max-height:480px;border:1px solid #d8dee6;border-radius:10px;display:none}</style></head><body><div class="card"><h2>Capture ECG / another screen</h2><p class="muted">按下方按鈕後，Chrome 會讓你選擇「分頁 / 視窗 / 整個螢幕」。雙螢幕時可直接選 ECG 所在的螢幕。</p><button id="go">Choose screen / window</button><div id="msg"></div><img id="preview"></div><script>const msg=document.getElementById('msg'),img=document.getElementById('preview');document.getElementById('go').onclick=async()=>{let st=null;try{if(!window.isSecureContext||!navigator.mediaDevices?.getDisplayMedia)throw new Error('Screen Capture API is unavailable in this browser/context.');msg.textContent='Opening selector…';st=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:false});const v=document.createElement('video');v.muted=true;v.srcObject=st;await v.play();await new Promise(r=>setTimeout(r,120));const c=document.createElement('canvas');c.width=v.videoWidth||1;c.height=v.videoHeight||1;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/png');img.src=dataUrl;img.style.display='block';msg.textContent='Captured ✓ Returning image to Auto Clinical Lab…';if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'ACL_SCREEN_CAPTURE',dataUrl},'*');setTimeout(()=>window.close(),500)}else{msg.textContent='Captured ✓ The original HIS window is no longer available; keep this preview open.'}}catch(e){msg.textContent=(e&&e.name==='NotAllowedError')?'Capture cancelled or blocked.':('Capture failed: '+(e?.message||e));}finally{if(st)st.getTracks().forEach(t=>t.stop())}};</script></body></html>
