const bytes=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
const source=new TextDecoder('utf-8').decode(bytes).trim();
const url='javascript:'+source;
const a=document.getElementById('bookmark');
a.href=url;
a.onclick=(e)=>{e.preventDefault();document.getElementById('status').textContent='請把連結拖到書籤列；不要在安裝頁直接執行。';};
const st=document.getElementById('status');
st.textContent=url.startsWith('javascript:')?'Bookmarklet 已載入 ✓':'';
document.getElementById('copyUrl').onclick=async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(url);ok=true}catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');ta.value=url;ta.style='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(ta);ta.focus();ta.select();
    try{ok=document.execCommand('copy')}catch(e){}ta.remove();
  }
  st.textContent=ok?'已複製 ✓：可新增書籤後貼到「網址」欄。':'無法自動複製；請改用拖曳方式。';
};
})();
</script></body></html>
