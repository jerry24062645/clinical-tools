<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMR Lab Formatter</title>

<style>
body {
    font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
    background: #f5f7fa;
    color: #243746;
}

h2 {
    color: #234;
    margin-bottom: 6px;
}

.subtitle {
    color: #667085;
    margin-bottom: 18px;
}

textarea {
    width: 100%;
    height: 260px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.5;
    box-sizing: border-box;
    border: 1px solid #cfd4dc;
    border-radius: 12px;
    resize: vertical;
    background: white;
}

.age-box {
    margin: 10px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.age-box input {
    width: 90px;
    padding: 8px;
    border: 1px solid #cfd4dc;
    border-radius: 8px;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button {
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
    color: white;
    font-weight: 700;
}

.full {
    background: #2563eb;
}

.endocrine {
    background: #059669;
}

.copy {
    background: #475467;
}

.clear {
    background: #b42318;
}

#output {
    margin-top: 20px;
    padding: 16px;
    min-height: 120px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 16px;
}

.note {
    margin-top: 12px;
    font-size: 13px;
    color: #667085;
}

@media (max-width: 600px) {
    body {
        margin: 0;
        padding: 16px;
    }

    textarea {
        height: 280px;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<h2>Concise EMR Lab Formatter</h2>

<div class="subtitle">
Paste raw laboratory data and convert it into concise EMR-ready format.
</div>

<div class="age-box">
    <label for="age"><strong>Age:</strong></label>

    <input
        type="number"
        id="age"
        min="1"
        max="120"
        step="1"
        placeholder="years"
    >

    <span class="note">
        Required for FIB-4 calculation
    </span>
</div>

<textarea
    id="input"
    placeholder="Paste raw laboratory data here..."
></textarea>

<div class="actions">

    <button
        class="full"
        onclick="formatLabs()">
        Format Labs
    </button>

    <button
        class="endocrine"
        onclick="formatEndocrine()">
        Endocrine OPD
    </button>

    <button
        class="copy"
        onclick="copyOutput()">
        Copy
    </button>

    <button
        class="clear"
        onclick="clearAll()">
        Clear
    </button>

</div>

<div id="output"></div>

<div class="note">
For documentation assistance only. Verify values and units against the original laboratory report before entering them into the EMR.
</div>


<script>

// ======================================================
// Basic functions
// ======================================================

function getValue(text, patterns) {

    for (const pattern of patterns) {

        const match = text.match(pattern);

        if (match) {
            return match[1];
        }
    }

    return null;
}


function normalizeResult(value) {

    if (!value) return null;

    const x = value.trim();

    if (/negative/i.test(x)) return "(-)";
    if (/positive/i.test(x)) return "(+)";

    if (x === "-") return "(-)";

    return x;
}


function addLine(lines, parts) {

    const clean = parts.filter(Boolean);

    if (clean.length) {
        lines.push("• " + clean.join("; "));
    }
}


// ======================================================
// Parse labs
// ======================================================

function getLabs(text) {

    return {

        // ------------------------------
        // Diabetes
        // ------------------------------

        hba1c: getValue(text, [
            /HbA1c\s*[:=：]?\s*([\d.]+)/i
        ]),

        eag: getValue(text, [
            /Estimated\s*average\s*glucose\s*\(eAG\)\s*[:=：]?\s*([\d.]+)/i,
            /\beAG\s*[:=：]?\s*([\d.]+)/i
        ]),

        gluAC: getValue(text, [
            /Glucose[-\s]?AC\s*[:=：]?\s*([\d.]+)/i,
            /Glu[-\s]?AC\s*[:=：]?\s*([\d.]+)/i
        ]),

        gluPC: getValue(text, [
            /Glucose[-\s]?PC\s*[:=：]?\s*([\d.]+)/i,
            /Glu[-\s]?PC\s*[:=：]?\s*([\d.]+)/i
        ]),

        gluPC2h: getValue(text, [
            /(?:口服)?75\s*(?:公克|g).*?(?:兩小時|二小時|2\s*(?:h|hr|hour)).*?GLUCOSE\s*[:=：]?\s*([\d.]+)/i,
            /Glu[-\s]?PC\s*2h\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Lipid
        // ------------------------------

        tc: getValue(text, [
            /\bCholesterol\s*[:=：]?\s*([\d.]+)/i,
            /\bTC\s*[:=：]?\s*([\d.]+)/i
        ]),

        tg: getValue(text, [
            /\bTG\s*[:=：]?\s*([\d.]+)/i,
            /Triglycerides?\s*[:=：]?\s*([\d.]+)/i
        ]),

        hdl: getValue(text, [
            /H\.?\s*D\.?\s*L\.?\s*cholesterol\s*[:=：]?\s*([\d.]+)/i,
            /\bHDL(?:[-\s]?C)?\s*[:=：]?\s*([\d.]+)/i
        ]),

        ldl: getValue(text, [
            /L\.?\s*D\.?\s*L\.?\s*cholesterol\s*[:=：]?\s*([\d.]+)/i,
            /\bLDL(?:[-\s]?C)?\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Renal
        // ------------------------------

        bun: getValue(text, [
            /\bBUN\s*[:=：]?\s*([\d.]+)/i
        ]),

        cr: getValue(text, [
            /\bCreatinine\s*[:=：]?\s*([\d.]+)/i,
            /\bCr\s*[:=：]?\s*([\d.]+)/i
        ]),

        egfr: getValue(text, [
            /\beGFR\s*[:=：]?\s*([\d.]+)/i
        ]),

        uricAcid: getValue(text, [
            /Uric\s+Acid(?:\s*\(B\))?\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Electrolytes
        // ------------------------------

        na: getValue(text, [
            /\bNa\s*[:=：]?\s*([\d.]+)/i
        ]),

        k: getValue(text, [
            /\bK\s*[:=：]?\s*([\d.]+)/i
        ]),

        cl: getValue(text, [
            /\bCL\s*[:=：]?\s*([\d.]+)/i,
            /\bCl\s*[:=：]?\s*([\d.]+)/i
        ]),

        ca: getValue(text, [
            /\bCa(?:\s*\(B\))?\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Liver
        // ------------------------------

        ast: getValue(text, [
            /S-GOT\s*[:=：]?\s*([\d.]+)/i,
            /\bAST\s*[:=：]?\s*([\d.]+)/i
        ]),

        alt: getValue(text, [
            /S-GPT\s*[:=：]?\s*([\d.]+)/i,
            /\bALT\s*[:=：]?\s*([\d.]+)/i
        ]),

        tBil: getValue(text, [
            /Bilirubin\s+Total\s*[:=：]?\s*([\d.]+)/i,
            /Total\s+Bilirubin\s*[:=：]?\s*([\d.]+)/i
        ]),

        dBil: getValue(text, [
            /Bilirubin\s+direct\s*[:=：]?\s*([\d.]+)/i,
            /Bilirubin\s+Direct\s*[:=：]?\s*([\d.]+)/i
        ]),

        ggt: getValue(text, [
            /r-GT\s*[:=：]?\s*([\d.]+)/i,
            /γ-GT\s*[:=：]?\s*([\d.]+)/i,
            /\bGGT\s*[:=：]?\s*([\d.]+)/i
        ]),

        albumin: getValue(text, [
            /\bAlbumin\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Thyroid
        // ------------------------------

        tsh: getValue(text, [
            /\bTSH\s*[:=：]?\s*([\d.]+)/i
        ]),

        ft4: getValue(text, [
            /Free\s*T4\s*[:=：]?\s*([\d.]+)/i,
            /\bFT4\s*[:=：]?\s*([\d.]+)/i
        ]),

        t3: getValue(text, [
            /\bT3\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Primary aldosteronism screening
        // ------------------------------

        pac: getValue(text, [
            /(?:PAC|Aldosterone|醛固酮)\s*[:=：]?\s*([\d.]+)/i
        ]),

        pra: getValue(text, [
            /(?:PRA|Plasma\s+Renin\s+Activity|Renin\s+Activity|腎素活性)\s*[:=：]?\s*([\d.]+)/i
        ]),

        arr: getValue(text, [
            /(?:ARR|Aldosterone.*Renin.*Ratio|醛固酮.*腎素.*比)\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Cardiac
        // ------------------------------

        ntprobnp: getValue(text, [
            /NT[-\s]?Pro[-\s]?BNP\s*[:=：]?\s*([\d.]+)/i
        ]),

        troponin: getValue(text, [
            /hs[-\s]?Troponin\s*T\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // CBC
        // ------------------------------

        wbc: getValue(text, [
            /(?:白血球(?:計數)?)?\s*WBC\s*[:=：]?\s*([\d.]+)/i
        ]),

        rbc: getValue(text, [
            /(?:紅血球)?\s*RBC\s*[:=：]?\s*([\d.]+)/i
        ]),

        hb: getValue(text, [
            /(?:血紅素)?\s*HGB\s*[:=：]?\s*([\d.]+)/i,
            /\bHemoglobin\s*[:=：]?\s*([\d.]+)/i,
            /\bHb\s*[:=：]?\s*([\d.]+)/i
        ]),

        hct: getValue(text, [
            /\bHCT\s*[:=：]?\s*([\d.]+)/i
        ]),

        mcv: getValue(text, [
            /\bMCV\s*[:=：]?\s*([\d.]+)/i
        ]),

        mch: getValue(text, [
            /\bMCH\s*[:=：]?\s*([\d.]+)/i
        ]),

        mchc: getValue(text, [
            /\bMCHC\s*[:=：]?\s*([\d.]+)/i
        ]),

        plt: getValue(text, [
            /\bPlatelet(?:s)?\s*[:=：]?\s*([\d.]+)/i,
            /\bPlt\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Coagulation
        // ------------------------------

        pt: getValue(text, [
            /Prothrombin\s+time\s*[:=：]?\s*([\d.]+)/i,
            /\bPT\s*[:=：]?\s*([\d.]+)/i
        ]),

        inr: getValue(text, [
            /\bINR\s*[:=：]?\s*([\d.]+)/i
        ]),

        aptt: getValue(text, [
            /\bAPTT\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // UACR / UPCR
        // ------------------------------

        uacr: getValue(text, [
            /\bUACR\s*[:=：]?\s*([\d.]+)/i
        ]),

        upcr: getValue(text, [
            /\bUPCR\s*[:=：]?\s*([\d.]+)/i
        ]),

        spotCr: getValue(text, [
            /Crea[-\s]?spot\s+urine\s*[:=：]?\s*([\d.]+)/i
        ]),

        microAlb: getValue(text, [
            /MicroAlbumin\s*[:=：]?\s*([\d.]+)/i
        ]),

        spotTP: getValue(text, [
            /TP[-\s]?spot\s+urine\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Urinalysis
        // ------------------------------

        urineProtein: getValue(text, [
            /尿蛋白PRO\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative|Trace)/i,
            /URINE\s+PROTEIN.*?(\+\/-|\+{1,4}|Negative|Trace)/i,
            /蛋白質定性檢查\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative|Trace)/i
        ]),

        urineGlucose: getValue(text, [
            /尿糖Glu\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ]),

        urineKetone: getValue(text, [
            /尿?酮體Ket\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ]),

        urineOB: getValue(text, [
            /潛血OB\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i,
            /OB-URINE\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ]),

        urineNit: getValue(text, [
            /亞硝酸鹽Nit\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ]),

        urineLE: getValue(text, [
            /Leukocyte\s+esterase\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ]),

        urineRBC: getValue(text, [
            /尿紅血球R\.?B\.?C\.?\s*[:=：]?\s*([\d]+\s*-\s*[\d]+)/i
        ]),

        urineWBC: getValue(text, [
            /尿白血球W\.?B\.?C\.?\s*[:=：]?\s*([\d]+\s*-\s*[\d]+)/i
        ]),

        bacteria: getValue(text, [
            /細菌Bacteria\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative|-)/i
        ]),

        urinePH: getValue(text, [
            /酸鹼度PH\s*[:=：]?\s*([\d.]+)/i
        ]),

        urineSG: getValue(text, [
            /尿比重Sp\.?gr\s*[:=：]?\s*([\d.]+)/i
        ]),


        // ------------------------------
        // Hepatitis
        // ------------------------------

        hbsAg: getValue(text, [
            /HBsAg\s*(Negative|Positive)/i
        ]),

        antiHBs: getValue(text, [
            /Anti-HBs\s*(Negative|Positive)/i
        ]),

        antiHCV: getValue(text, [
            /Anti-HCV\s*(Negative|Positive)/i
        ]),


        // ------------------------------
        // Inflammation
        // ------------------------------

        crp: getValue(text, [
            /\bCRP\s*[:=：]?\s*([\d.]+)/i
        ]),

        pct: getValue(text, [
            /Procalcitonin(?:\(PCT\))?\s*[:=：]?\s*([\d.]+)/i
        ]),

        bloodKetone: getValue(text, [
            /Ketone\s+Body\s*\(BLOOD\)\s*[:=：]?\s*(\+\/-|\+{1,4}|Negative)/i
        ])

    };
}


// ======================================================
// Lipid formatter
// ======================================================

function buildLipid(lab) {

    const names = [];
    const values = [];

    if (lab.tc) {
        names.push("TC");
        values.push(lab.tc);
    }

    if (lab.tg) {
        names.push("TG");
        values.push(lab.tg);
    }

    if (lab.hdl) {
        names.push("HDL");
        values.push(lab.hdl);
    }

    if (lab.ldl) {
        names.push("LDL");
        values.push(lab.ldl);
    }

    if (!values.length) return null;

    return `${names.join("/")} ${values.join("/")} mg/dL`;
}


// ======================================================
// FIB-4
// ======================================================

function getFib4(lab) {

    const age =
        parseFloat(
            document.getElementById("age").value
        );

    const ast = parseFloat(lab.ast);
    const alt = parseFloat(lab.alt);
    const plt = parseFloat(lab.plt);

    if (
        !age ||
        !Number.isFinite(ast) ||
        !Number.isFinite(alt) ||
        !Number.isFinite(plt) ||
        alt <= 0 ||
        plt <= 0
    ) {
        return null;
    }

    const fib4 =
        (age * ast) /
        (
            plt *
            Math.sqrt(alt)
        );

    let risk = "";

    if (age >= 65) {

        if (fib4 < 2.0) {
            risk = "Low risk";
        }
        else if (fib4 <= 2.67) {
            risk = "Intermediate risk";
        }
        else {
            risk = "High risk";
        }

    }
    else {

        if (fib4 < 1.3) {
            risk = "Low risk";
        }
        else if (fib4 <= 2.67) {
            risk = "Intermediate risk";
        }
        else {
            risk = "High risk";
        }
    }

    let result =
        `FIB-4 ${fib4.toFixed(2)} (${risk}`;

    if (age < 35) {
        result += "; limited accuracy age <35";
    }

    result += ")";

    return result;
}


// ======================================================
// Endocrine OPD Mode
// ======================================================

function formatEndocrine() {

    const text =
        document.getElementById("input").value;

    if (!text.trim()) {
        document.getElementById("output").textContent = "";
        return;
    }

    const lab = getLabs(text);

    const lines = [];


    // ==========================================
    // Line 1
    // HbA1c / Glu-AC / UACR / UPCR
    // ==========================================

    let line1 = [];

    if (lab.hba1c) {

        let item =
            `HbA1c ${lab.hba1c}%`;

        if (lab.eag) {
            item +=
                ` (eAG ${lab.eag} mg/dL)`;
        }

        line1.push(item);
    }

    if (lab.gluAC) {
        line1.push(
            `Glu-AC ${lab.gluAC} mg/dL`
        );
    }
    if (lab.gluPC2h) {
        line1.push(
            `Glu-PC 2h ${lab.gluPC2h} mg/dL`
        );
    }
    else if (lab.gluPC) {
        line1.push(
            `Glu-PC ${lab.gluPC} mg/dL`
        );
    }

    if (lab.uacr) {
        line1.push(
            `UACR ${lab.uacr} mg/g`
        );
    }

    if (lab.upcr) {
        line1.push(
            `UPCR ${lab.upcr} mg/g`
        );
    }

    addLine(lines, line1);


    // ==========================================
    // Line 2
    // Lipid / UA
    // ==========================================

    let line2 = [];

    const lipid =
        buildLipid(lab);

    if (lipid) {
        line2.push(lipid);
    }

    if (lab.uricAcid) {
        line2.push(
            `UA ${lab.uricAcid} mg/dL`
        );
    }

    addLine(lines, line2);


    // ==========================================
    // Line 3
    // BUN / Cr / eGFR / AST/ALT
    // ==========================================

    let line3 = [];

    if (lab.bun) {
        line3.push(
            `BUN ${lab.bun} mg/dL`
        );
    }

    if (lab.cr) {
        line3.push(
            `Cr ${lab.cr} mg/dL`
        );
    }

    if (lab.egfr) {
        line3.push(
            `eGFR ${lab.egfr}`
        );
    }

    if (lab.ast && lab.alt) {

        line3.push(
            `AST/ALT ${lab.ast}/${lab.alt} U/L`
        );

    }
    else {

        if (lab.ast) {
            line3.push(
                `AST ${lab.ast} U/L`
            );
        }

        if (lab.alt) {
            line3.push(
                `ALT ${lab.alt} U/L`
            );
        }
    }

    addLine(lines, line3);


    // ==========================================
    // Line 4
    // TFT
    // ==========================================

    let line4 = [];

    if (lab.tsh) {
        line4.push(
            `TSH ${lab.tsh} μIU/mL`
        );
    }

    if (lab.ft4) {
        line4.push(
            `FT4 ${lab.ft4} ng/dL`
        );
    }

    if (lab.t3) {
        line4.push(
            `T3 ${lab.t3} ng/mL`
        );
    }

    addLine(lines, line4);


    // ==========================================
    // Primary aldosteronism screening
    // ==========================================

    let pa = [];

    if (lab.pac) {
        const pacFlag = Number(lab.pac) > 15 ? "H" : "";
        pa.push(`PAC ${pacFlag}${lab.pac} ng/dL`);
    }

    if (lab.pra) {
        pa.push(`PRA ${lab.pra} ng/mL/hr`);
    }

    if (lab.arr) {
        const arrFlag = Number(lab.arr) > 20 ? "H" : "";
        pa.push(`ARR ${arrFlag}${lab.arr} ng/dL/(ng/mL/hr)`);
    }

    addLine(lines, pa);


    // ==========================================
    // Line 5
    // CBC / FIB-4
    // ==========================================

    let line5 = [];

    if (lab.wbc) {
        line5.push(
            `WBC ${lab.wbc} ×10³/μL`
        );
    }

    if (lab.hb) {
        line5.push(
            `Hb ${lab.hb} g/dL`
        );
    }

    if (lab.mcv) {
        line5.push(
            `MCV ${lab.mcv} fL`
        );
    }

    if (lab.plt) {
        line5.push(
            `Plt ${lab.plt} ×10³/μL`
        );
    }

    const fib4 =
        getFib4(lab);

    if (fib4) {
        line5.push(fib4);
    }

    addLine(lines, line5);


    document.getElementById("output").textContent =
        lines.length
        ? lines.join("\n")
        : "No recognized endocrine OPD laboratory values found.";
}


// ======================================================
// FULL LAB MODE
// ======================================================

function formatLabs() {

    const text =
        document.getElementById("input").value;

    if (!text.trim()) {
        document.getElementById("output").textContent = "";
        return;
    }

    const lab =
        getLabs(text);

    const lines = [];


    // ==========================================
    // Diabetes
    // ==========================================

    let dm = [];

    if (lab.hba1c) {

        let item =
            `HbA1c ${lab.hba1c}%`;

        if (lab.eag) {
            item +=
                ` (eAG ${lab.eag} mg/dL)`;
        }

        dm.push(item);
    }

    if (lab.gluAC) {
        dm.push(
            `Glu-AC ${lab.gluAC} mg/dL`
        );
    }

    if (lab.gluPC2h) {
        dm.push(
            `Glu-PC 2h ${lab.gluPC2h} mg/dL`
        );
    }

    if (lab.gluPC) {
        dm.push(
            `Glu-PC ${lab.gluPC} mg/dL`
        );
    }

    addLine(lines, dm);


    // ==========================================
    // Lipid / uric acid
    // ==========================================

    let metabolic = [];

    const lipid =
        buildLipid(lab);

    if (lipid) {
        metabolic.push(lipid);
    }

    if (lab.uricAcid) {
        metabolic.push(
            `UA ${lab.uricAcid} mg/dL`
        );
    }

    addLine(lines, metabolic);


    // ==========================================
    // Renal
    // ==========================================

    let renal = [];

    if (lab.bun) {
        renal.push(
            `BUN ${lab.bun} mg/dL`
        );
    }

    if (lab.cr) {
        renal.push(
            `Cr ${lab.cr} mg/dL`
        );
    }

    if (lab.egfr) {
        renal.push(
            `eGFR ${lab.egfr}`
        );
    }

    addLine(lines, renal);


    // ==========================================
    // Electrolytes
    // ==========================================

    let electrolytes = [];

    if (lab.na) {
        electrolytes.push(
            `Na ${lab.na} mmol/L`
        );
    }

    if (lab.k) {
        electrolytes.push(
            `K ${lab.k} mmol/L`
        );
    }

    if (lab.cl) {
        electrolytes.push(
            `Cl ${lab.cl} mmol/L`
        );
    }

    if (lab.ca) {
        electrolytes.push(
            `Ca ${lab.ca} mg/dL`
        );
    }

    addLine(lines, electrolytes);


    // ==========================================
    // Liver
    // ==========================================

    let liver = [];

    if (lab.ast && lab.alt) {

        liver.push(
            `AST/ALT ${lab.ast}/${lab.alt} U/L`
        );

    }
    else {

        if (lab.ast) {
            liver.push(
                `AST ${lab.ast} U/L`
            );
        }

        if (lab.alt) {
            liver.push(
                `ALT ${lab.alt} U/L`
            );
        }
    }

    if (lab.tBil) {
        liver.push(
            `T-Bil ${lab.tBil} mg/dL`
        );
    }

    if (lab.dBil) {
        liver.push(
            `D-Bil ${lab.dBil} mg/dL`
        );
    }

    if (lab.ggt) {
        liver.push(
            `γ-GT ${lab.ggt} U/L`
        );
    }

    if (lab.albumin) {
        liver.push(
            `Alb ${lab.albumin} g/dL`
        );
    }

    addLine(lines, liver);


    // ==========================================
    // TFT
    // ==========================================

    let thyroid = [];

    if (lab.tsh) {
        thyroid.push(
            `TSH ${lab.tsh} μIU/mL`
        );
    }

    if (lab.ft4) {
        thyroid.push(
            `FT4 ${lab.ft4} ng/dL`
        );
    }

    if (lab.t3) {
        thyroid.push(
            `T3 ${lab.t3} ng/mL`
        );
    }

    addLine(lines, thyroid);


    // ==========================================
    // Cardiac
    // ==========================================

    let cardiac = [];

    if (lab.ntprobnp) {
        cardiac.push(
            `NT-proBNP ${lab.ntprobnp} pg/mL`
        );
    }

    if (lab.troponin) {
        cardiac.push(
            `hs-TnT ${lab.troponin} ng/L`
        );
    }

    addLine(lines, cardiac);


    // ==========================================
    // CBC + FIB-4
    // ==========================================

    let cbc = [];

    if (lab.wbc) {
        cbc.push(
            `WBC ${lab.wbc} ×10³/μL`
        );
    }

    if (lab.hb) {
        cbc.push(
            `Hb ${lab.hb} g/dL`
        );
    }

    if (lab.mcv) {
        cbc.push(
            `MCV ${lab.mcv} fL`
        );
    }

    if (lab.plt) {
        cbc.push(
            `Plt ${lab.plt} ×10³/μL`
        );
    }

    const fib4 =
        getFib4(lab);

    if (fib4) {
        cbc.push(fib4);
    }

    addLine(lines, cbc);


    // ==========================================
    // Coagulation
    // ==========================================

    let coag = [];

    if (lab.pt) {
        coag.push(
            `PT ${lab.pt} sec`
        );
    }

    if (lab.inr) {
        coag.push(
            `INR ${lab.inr}`
        );
    }

    if (lab.aptt) {
        coag.push(
            `APTT ${lab.aptt} sec`
        );
    }

    addLine(lines, coag);


    // ==========================================
    // UACR / UPCR
    // ==========================================

    let urineRenal = [];

    if (lab.uacr) {
        urineRenal.push(
            `UACR ${lab.uacr} mg/g`
        );
    }

    if (lab.upcr) {
        urineRenal.push(
            `UPCR ${lab.upcr} mg/g`
        );
    }

    addLine(lines, urineRenal);


    // ==========================================
    // Urine raw renal data
    // ==========================================

    let urineRaw = [];

    if (lab.spotCr) {
        urineRaw.push(
            `spot urine Cr ${lab.spotCr} mg/L`
        );
    }

    if (lab.microAlb) {
        urineRaw.push(
            `microalbumin ${lab.microAlb} mg/L`
        );
    }

    if (lab.spotTP) {
        urineRaw.push(
            `spot urine TP ${lab.spotTP} mg/L`
        );
    }

    addLine(lines, urineRaw);


    // ==========================================
    // Urinalysis
    // ==========================================

    let urine = [];

    if (lab.urineGlucose) {
        urine.push(
            `Glu ${normalizeResult(lab.urineGlucose)}`
        );
    }

    if (lab.urineProtein) {
        urine.push(
            `PRO ${normalizeResult(lab.urineProtein)}`
        );
    }

    if (lab.urineKetone) {
        urine.push(
            `Ket ${normalizeResult(lab.urineKetone)}`
        );
    }

    if (lab.urineOB) {
        urine.push(
            `OB ${normalizeResult(lab.urineOB)}`
        );
    }

    if (lab.urineNit) {
        urine.push(
            `Nit ${normalizeResult(lab.urineNit)}`
        );
    }

    if (lab.urineLE) {
        urine.push(
            `LE ${normalizeResult(lab.urineLE)}`
        );
    }

    if (lab.urineRBC) {
        urine.push(
            `RBC ${lab.urineRBC}/HPF`
        );
    }

    if (lab.urineWBC) {
        urine.push(
            `WBC ${lab.urineWBC}/HPF`
        );
    }

    if (lab.bacteria) {
        urine.push(
            `bacteria ${normalizeResult(lab.bacteria)}`
        );
    }

    if (urine.length) {
        lines.push(
            "• UA: " +
            urine.join("; ")
        );
    }


    let urinePhysical = [];

    if (lab.urineSG) {
        urinePhysical.push(
            `Sp.gr ${lab.urineSG}`
        );
    }

    if (lab.urinePH) {
        urinePhysical.push(
            `pH ${lab.urinePH}`
        );
    }

    addLine(
        lines,
        urinePhysical
    );


    // ==========================================
    // Hepatitis
    // ==========================================

    let hepatitis = [];

    if (lab.hbsAg) {
        hepatitis.push(
            `HBsAg ${normalizeResult(lab.hbsAg)}`
        );
    }

    if (lab.antiHBs) {
        hepatitis.push(
            `Anti-HBs ${normalizeResult(lab.antiHBs)}`
        );
    }

    if (lab.antiHCV) {
        hepatitis.push(
            `Anti-HCV ${normalizeResult(lab.antiHCV)}`
        );
    }

    addLine(
        lines,
        hepatitis
    );


    // ==========================================
    // Inflammation
    // ==========================================

    let inflammation = [];

    if (lab.crp) {
        inflammation.push(
            `CRP ${lab.crp} mg/dL`
        );
    }

    if (lab.pct) {
        inflammation.push(
            `PCT ${lab.pct} ng/mL`
        );
    }

    addLine(
        lines,
        inflammation
    );


    // ==========================================
    // Blood ketone
    // ==========================================

    if (lab.bloodKetone) {

        lines.push(
            `• Blood ketone ${normalizeResult(lab.bloodKetone)}`
        );
    }


    document.getElementById("output").textContent =
        lines.length
        ? lines.join("\n")
        : "No recognized laboratory values found.";
}


// ======================================================
// Copy
// ======================================================

async function copyOutput() {

    const output =
        document.getElementById("output").textContent;

    if (!output) return;

    try {

        await navigator.clipboard.writeText(output);

    }
    catch (err) {

        const outputDiv =
            document.getElementById("output");

        const range =
            document.createRange();

        range.selectNodeContents(outputDiv);

        const selection =
            window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        document.execCommand("copy");

        selection.removeAllRanges();
    }
}


// ======================================================
// Clear
// ======================================================

function clearAll() {

    document.getElementById("input").value = "";

    document.getElementById("age").value = "";

    document.getElementById("output").textContent = "";
}

</script>
